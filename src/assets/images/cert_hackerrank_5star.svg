<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap');
      .font-sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: 'Fira Code', monospace; }
    </style>
    <!-- Card Drop Shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="glowHex" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Dark IDE Canvas Background -->
  <rect width="1200" height="628" fill="#1b1e2b" />

  <!-- HackerRank Top Navigation Bar -->
  <rect x="0" y="0" width="1200" height="42" fill="#151722" />
  
  <!-- HackerRank Logo -->
  <g transform="translate(24, 12)">
    <rect x="0" y="0" width="18" height="18" rx="3" fill="#00EA64" />
    <text x="26" y="14" class="font-sans" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">HackerRank</text>
    <text x="120" y="13" class="font-sans" font-size="12" font-weight="500" fill="#94A3B8">Prepare  &gt;  Algorithms  &gt;  Strings  &gt;  Common Child</text>
  </g>

  <!-- Top Right IDE Options -->
  <g transform="translate(860, 11)">
    <rect x="0" y="0" width="105" height="22" rx="4" fill="#25293c" stroke="#3b4261" stroke-width="1" />
    <text x="12" y="15" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">Change Theme</text>

    <rect x="115" y="0" width="115" height="22" rx="4" fill="#25293c" stroke="#3b4261" stroke-width="1" />
    <text x="125" y="15" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">Language: C++11</text>
  </g>

  <!-- Background Left: Problem Description & Testcases -->
  <g transform="translate(24, 65)">
    <text x="0" y="15" class="font-mono" font-size="12" fill="#64748B">Sample Input 2</text>
    <rect x="0" y="26" width="300" height="52" rx="4" fill="#12141d" />
    <text x="12" y="48" class="font-mono" font-size="12" fill="#94A3B8">SHINCHAN</text>
    <text x="12" y="66" class="font-mono" font-size="12" fill="#94A3B8">NOHARAAA</text>

    <text x="0" y="105" class="font-mono" font-size="12" fill="#64748B">Sample Output 2</text>
    <rect x="0" y="116" width="300" height="32" rx="4" fill="#12141d" />
    <text x="12" y="138" class="font-mono" font-size="13" font-weight="bold" fill="#00EA64">3</text>

    <text x="0" y="175" class="font-mono" font-size="12" fill="#64748B">Explanation 2</text>
    <text x="0" y="195" class="font-sans" font-size="12" fill="#64748B">The longest string that can be formed between</text>
    <text x="0" y="212" class="font-sans" font-size="12" fill="#64748B">SHINCHAN and NOHARAAA is NHA.</text>

    <text x="0" y="250" class="font-mono" font-size="12" fill="#64748B">Sample Input 3</text>
    <rect x="0" y="260" width="300" height="52" rx="4" fill="#12141d" />
    <text x="12" y="282" class="font-mono" font-size="12" fill="#94A3B8">ABCDEF</text>
    <text x="12" y="300" class="font-mono" font-size="12" fill="#94A3B8">FBDAMN</text>
  </g>

  <!-- Background Right: C++ Solution Code in Editor -->
  <g transform="translate(540, 65)">
    <!-- Line numbers & code -->
    <g class="font-mono" font-size="13">
      <text x="0" y="20" fill="#475569">1</text>
      <text x="35" y="20" fill="#E2E8F0"><tspan fill="#F43F5E">#include</tspan> <tspan fill="#38BDF8">&lt;bits/stdc++.h&gt;</tspan></text>

      <text x="0" y="44" fill="#475569">2</text>
      <text x="35" y="44" fill="#E2E8F0"><tspan fill="#F43F5E">using</tspan> <tspan fill="#F43F5E">namespace</tspan> std;</text>

      <text x="0" y="78" fill="#475569">3</text>
      <text x="35" y="78" fill="#E2E8F0"><tspan fill="#38BDF8">int</tspan> <tspan fill="#FBBF24">commonChild</tspan>(string s1, string s2) {</text>

      <text x="0" y="102" fill="#475569">4</text>
      <text x="35" y="102" fill="#E2E8F0">    <tspan fill="#38BDF8">int</tspan> n = s1.<tspan fill="#FBBF24">size</tspan>();</text>

      <text x="0" y="126" fill="#475569">5</text>
      <text x="35" y="126" fill="#E2E8F0">    vector&lt;vector&lt;<tspan fill="#38BDF8">int</tspan>&gt;&gt; dp(n + 1, vector&lt;<tspan fill="#38BDF8">int</tspan>&gt;(n + 1, 0));</text>

      <text x="0" y="150" fill="#475569">6</text>
      <text x="35" y="150" fill="#E2E8F0">    <tspan fill="#F43F5E">for</tspan> (<tspan fill="#38BDF8">int</tspan> i = 1; i &lt;= n; i++) {</text>

      <text x="0" y="174" fill="#475569">7</text>
      <text x="35" y="174" fill="#E2E8F0">        <tspan fill="#F43F5E">for</tspan> (<tspan fill="#38BDF8">int</tspan> j = 1; j &lt;= n; j++) {</text>

      <text x="0" y="198" fill="#475569">8</text>
      <text x="35" y="198" fill="#E2E8F0">            <tspan fill="#F43F5E">if</tspan> (s1[i - 1] == s2[j - 1]) {</text>

      <text x="0" y="222" fill="#475569">9</text>
      <text x="35" y="222" fill="#E2E8F0">                dp[i][j] = dp[i - 1][j - 1] + 1;</text>

      <text x="0" y="246" fill="#475569">10</text>
      <text x="35" y="246" fill="#E2E8F0">            } <tspan fill="#F43F5E">else</tspan> {</text>

      <text x="0" y="270" fill="#475569">11</text>
      <text x="35" y="270" fill="#E2E8F0">                dp[i][j] = <tspan fill="#FBBF24">max</tspan>(dp[i - 1][j], dp[i][j - 1]);</text>

      <text x="0" y="294" fill="#475569">12</text>
      <text x="35" y="294" fill="#E2E8F0">            }</text>

      <text x="0" y="318" fill="#475569">13</text>
      <text x="35" y="318" fill="#E2E8F0">        }</text>

      <text x="0" y="342" fill="#475569">14</text>
      <text x="35" y="342" fill="#E2E8F0">    }</text>

      <text x="0" y="366" fill="#475569">15</text>
      <text x="35" y="366" fill="#E2E8F0">    <tspan fill="#F43F5E">return</tspan> dp[n][n];</text>

      <text x="0" y="390" fill="#475569">16</text>
      <text x="35" y="390" fill="#E2E8F0">}</text>
    </g>
  </g>

  <!-- Dark Modal Backdrop Dimmer -->
  <rect width="1200" height="628" fill="#000000" opacity="0.45" />

  <!-- Celebration Confetti Particles Floating In Background -->
  <!-- Left Side Confetti -->
  <rect x="70" y="110" width="12" height="20" rx="2" fill="#FBBF24" transform="rotate(35 70 110)" />
  <rect x="180" y="190" width="9" height="18" rx="1.5" fill="#F59E0B" transform="rotate(-25 180 190)" />
  <rect x="110" y="280" width="14" height="22" rx="2" fill="#FCD34D" transform="rotate(18 110 280)" />
  <rect x="220" y="360" width="11" height="20" rx="1.5" fill="#FBBF24" transform="rotate(-40 220 360)" />
  <rect x="150" y="470" width="13" height="22" rx="2" fill="#F59E0B" transform="rotate(28 150 470)" />
  <rect x="60" y="520" width="10" height="17" rx="1.5" fill="#FCD34D" transform="rotate(-15 60 520)" />

  <!-- Center Top Confetti -->
  <rect x="360" y="80" width="11" height="22" rx="2" fill="#FBBF24" transform="rotate(-30 360 80)" />
  <rect x="460" y="120" width="12" height="19" rx="1.5" fill="#F59E0B" transform="rotate(45 460 120)" />
  <rect x="740" y="90" width="10" height="20" rx="1.5" fill="#FCD34D" transform="rotate(20 740 90)" />
  <rect x="850" y="130" width="13" height="24" rx="2" fill="#FBBF24" transform="rotate(-35 850 130)" />

  <!-- Right Side Confetti -->
  <rect x="980" y="190" width="12" height="22" rx="2" fill="#F59E0B" transform="rotate(40 980 190)" />
  <rect x="1080" y="140" width="14" height="20" rx="2" fill="#FBBF24" transform="rotate(-15 1080 140)" />
  <rect x="920" y="320" width="11" height="21" rx="1.5" fill="#FCD34D" transform="rotate(50 920 320)" />
  <rect x="1050" y="390" width="13" height="22" rx="2" fill="#F59E0B" transform="rotate(-20 1050 390)" />
  <rect x="960" y="490" width="10" height="18" rx="1.5" fill="#FBBF24" transform="rotate(30 960 490)" />
  <rect x="1100" y="530" width="14" height="24" rx="2" fill="#FCD34D" transform="rotate(-45 1100 530)" />

  <!-- Near Modal Confetti -->
  <rect x="420" y="270" width="14" height="20" rx="2" fill="#FBBF24" transform="rotate(-10 420 270)" />
  <rect x="430" y="340" width="9" height="18" rx="1.5" fill="#F59E0B" transform="rotate(55 430 340)" />
  <rect x="760" y="300" width="12" height="20" rx="2" fill="#FCD34D" transform="rotate(-30 760 300)" />
  <rect x="730" y="440" width="11" height="19" rx="1.5" fill="#FBBF24" transform="rotate(25 730 440)" />
  <rect x="640" y="520" width="12" height="20" rx="2" fill="#F59E0B" transform="rotate(15 640 520)" />
  <rect x="520" y="525" width="10" height="18" rx="1.5" fill="#FCD34D" transform="rotate(-20 520 525)" />

  <!-- ========================================================================= -->
  <!-- CENTER MODAL POPUP (THE EXACT HACKERRANK 5-STAR ACHIEVEMENT DIALOG)       -->
  <!-- ========================================================================= -->
  <g transform="translate(425, 175)" filter="url(#cardShadow)">
    
    <!-- Modal Card Body -->
    <rect x="0" y="0" width="350" height="290" rx="14" fill="#FFFFFF" />

    <!-- Close Button (X) in Top Right -->
    <g transform="translate(315, 18)">
      <line x1="0" y1="0" x2="12" y2="12" stroke="#475569" stroke-width="2.2" stroke-linecap="round" />
      <line x1="12" y1="0" x2="0" y2="12" stroke="#475569" stroke-width="2.2" stroke-linecap="round" />
    </g>

    <!-- Top Floating Golden Hexagon Badge -->
    <g transform="translate(175, -28)" filter="url(#glowHex)">
      <!-- Hexagon Path -->
      <path d="M 0 -38 L 34 -18 L 34 20 L 0 40 L -34 20 L -34 -18 Z" fill="#F59E0B" stroke="#FBBF24" stroke-width="2.5" />
      
      <!-- Cube Icon inside Badge -->
      <g transform="translate(-10, -26) scale(0.85)">
        <!-- Top facet -->
        <polygon points="12,2 22,7 12,12 2,7" fill="#FEF3C7" opacity="0.95" />
        <!-- Left facet -->
        <polygon points="2,8 12,13 12,23 2,18" fill="#FDE68A" opacity="0.85" />
        <!-- Right facet -->
        <polygon points="22,8 12,13 12,23 22,18" fill="#F59E0B" opacity="0.9" />
      </g>

      <!-- Problem Solving Badge Label -->
      <text x="0" y="10" class="font-sans" font-size="8.5" font-weight="800" fill="#78350F" text-anchor="middle" letter-spacing="0.2">Problem Solving</text>

      <!-- 5 Gold Stars (★★★★★) -->
      <g transform="translate(-24, 18)">
        <!-- Star 1 -->
        <path d="M 5 0 L 6.2 3.8 L 10 3.8 L 7 6.2 L 8.2 10 L 5 7.6 L 1.8 10 L 3 6.2 L 0 3.8 L 3.8 3.8 Z" fill="#78350F" transform="scale(0.8)" />
        <!-- Star 2 -->
        <path d="M 5 0 L 6.2 3.8 L 10 3.8 L 7 6.2 L 8.2 10 L 5 7.6 L 1.8 10 L 3 6.2 L 0 3.8 L 3.8 3.8 Z" fill="#78350F" transform="translate(10, 0) scale(0.8)" />
        <!-- Star 3 -->
        <path d="M 5 0 L 6.2 3.8 L 10 3.8 L 7 6.2 L 8.2 10 L 5 7.6 L 1.8 10 L 3 6.2 L 0 3.8 L 3.8 3.8 Z" fill="#78350F" transform="translate(20, 0) scale(0.8)" />
        <!-- Star 4 -->
        <path d="M 5 0 L 6.2 3.8 L 10 3.8 L 7 6.2 L 8.2 10 L 5 7.6 L 1.8 10 L 3 6.2 L 0 3.8 L 3.8 3.8 Z" fill="#78350F" transform="translate(30, 0) scale(0.8)" />
        <!-- Star 5 -->
        <path d="M 5 0 L 6.2 3.8 L 10 3.8 L 7 6.2 L 8.2 10 L 5 7.6 L 1.8 10 L 3 6.2 L 0 3.8 L 3.8 3.8 Z" fill="#78350F" transform="translate(40, 0) scale(0.8)" />
      </g>
    </g>

    <!-- Congrats Headline -->
    <text x="175" y="96" class="font-sans" font-size="27" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="-0.5">Congrats!</text>

    <!-- Subtitle Text -->
    <text x="175" y="132" class="font-sans" font-size="14.5" font-weight="500" fill="#475569" text-anchor="middle">You have earned your 5th star.</text>

    <!-- Green Continue Button -->
    <g transform="translate(110, 158)">
      <rect x="0" y="0" width="130" height="42" rx="6" fill="#00A854" />
      <text x="65" y="26" class="font-sans" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Continue</text>
    </g>

    <!-- Social Share Icons (Twitter & LinkedIn) -->
    <g transform="translate(150, 235)">
      <!-- Twitter bird / X icon -->
      <g transform="translate(0, 0)">
        <path d="M 18 3 C 17.3 3.3 16.5 3.6 15.7 3.7 C 16.5 3.2 17.1 2.4 17.4 1.5 C 16.6 2 15.7 2.3 14.8 2.5 C 14 1.7 12.9 1.2 11.7 1.2 C 9.4 1.2 7.5 3.1 7.5 5.5 C 7.5 5.8 7.5 6.1 7.6 6.5 C 4.1 6.3 1.1 4.7 0.1 2.2 C -0.3 2.8 -0.4 3.5 -0.4 4.3 C -0.4 5.8 0.3 7.1 1.5 7.8 C 0.8 7.8 0.2 7.6 -0.3 7.3 C -0.3 7.3 -0.3 7.4 -0.3 7.4 C -0.3 9.4 1.1 11 3 11.4 C 2.6 11.5 2.2 11.6 1.8 11.6 C 1.5 11.6 1.3 11.5 1 11.5 C 1.6 13.1 3.1 14.3 4.9 14.3 C 3.5 15.4 1.7 16.1 -0.2 16.1 C -0.6 16.1 -0.9 16.1 -1.3 16 C 0.5 17.2 2.7 17.9 5.1 17.9 C 12.7 17.9 16.9 11.6 16.9 6.2 C 16.9 6 16.9 5.8 16.9 5.6 C 17.7 5 18.4 4.3 18.9 3.5" fill="#64748B" transform="scale(0.85)" />
      </g>

      <!-- LinkedIn icon -->
      <g transform="translate(32, 0)">
        <path d="M 2 0 C 0.9 0 0 0.9 0 2 L 0 14 C 0 15.1 0.9 16 2 16 L 14 16 C 15.1 16 16 15.1 16 14 L 16 2 C 16 0.9 15.1 0 14 0 L 2 0 Z M 4.8 13.3 L 2.4 13.3 L 2.4 5.9 L 4.8 5.9 L 4.8 13.3 Z M 3.6 4.9 C 2.8 4.9 2.2 4.3 2.2 3.5 C 2.2 2.7 2.8 2.1 3.6 2.1 C 4.4 2.1 5 2.7 5 3.5 C 5 4.3 4.4 4.9 3.6 4.9 Z M 13.6 13.3 L 11.2 13.3 L 11.2 9.5 C 11.2 8.6 11.2 7.4 9.9 7.4 C 8.6 7.4 8.4 8.4 8.4 9.4 L 8.4 13.3 L 6 13.3 L 6 5.9 L 8.3 5.9 L 8.3 6.9 C 8.6 6.3 9.4 5.7 10.5 5.7 C 12.9 5.7 13.6 7.3 13.6 9.3 L 13.6 13.3 Z" fill="#64748B" transform="scale(0.9)" />
      </g>
    </g>

  </g>
</svg>
